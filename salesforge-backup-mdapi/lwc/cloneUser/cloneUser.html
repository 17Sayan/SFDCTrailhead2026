<template>
    <lightning-button label="Clone User" variant="brand" onclick={handleCloneClick}></lightning-button>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Clone User</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                    </template>
                    <template if:true={licenseWarning}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                            <lightning-icon icon-name="utility:warning" alternative-text="Warning" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span>{licenseWarning}</span>
                        </div>
                    </template>
                    <template if:true={errorMessage}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                            <lightning-icon icon-name="utility:error" alternative-text="Error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <span>{errorMessage}</span>
                        </div>
                    </template>
                    <template if:false={isLoading}>
                        <div class="slds-section slds-is-open slds-m-bottom_medium">
                            <h3 class="slds-section__title slds-text-title_caps">Cloned From Source</h3>
                            <div class="slds-grid slds-wrap slds-gutters_small slds-p-top_small">
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-body_small slds-text-color_weak">Department</p>
                                    <p>{sourceUser.Department}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-body_small slds-text-color_weak">Title</p>
                                    <p>{sourceUser.Title}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-body_small slds-text-color_weak">Locale</p>
                                    <p>{sourceUser.LocaleSidKey}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="slds-text-body_small slds-text-color_weak">Time Zone</p>
                                    <p>{sourceUser.TimeZoneSidKey}</p>
                                </div>
                            </div>
                        </div>
                        <div class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-text-title_caps">New User Details</h3>
                            <div class="slds-grid slds-wrap slds-gutters_small slds-p-top_small">
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <lightning-input label="First Name" data-field="FirstName" value={newFirstName} onchange={handleInputChange} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <lightning-input label="Last Name" data-field="LastName" value={newLastName} onchange={handleInputChange} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <lightning-input label="Email" type="email" data-field="Email" value={newEmail} onchange={handleInputChange} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <lightning-input label="Username" data-field="Username" value={newUsername} onchange={handleInputChange} required></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <lightning-input label="Alias" data-field="Alias" value={newAlias} onchange={handleInputChange} required maxlength="8"></lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <lightning-input label="Community Nickname" data-field="CommunityNickname" value={newCommunityNickname} onchange={handleInputChange}></lightning-input>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal} class="slds-m-right_small"></lightning-button>
                    <lightning-button label="Clone" variant="brand" onclick={handleClone} disabled={isLoading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
